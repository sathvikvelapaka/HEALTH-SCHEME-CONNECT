
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Scheme Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: light dark;
        --color-primary-blue: #0f172a; /* Sophisticated slate dark */
        --color-primary-green: #0d9488; /* Elegant teal */
        --color-secondary-orange: #f97316; /* Clean orange */
        --color-secondary-purple: #6366f1; /* Vibrant indigo */
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-error: #ef4444;
        --color-info: #3b82f6;
        --color-bg-primary: #f8fafc; /* Sleek slate-50 */
        --color-bg-secondary: #ffffff;
        --color-bg-dark: #0f172a;
        --color-text-primary: #0f172a;
        --color-text-secondary: #475569;
        --color-text-muted: #64748b;
      }
      html.dark {
        --color-primary-blue: #3b82f6; /* Brilliant Blue-500 for perfect dark mode contrast */
        --color-primary-green: #10b981; /* Emerald-500 */
        --color-bg-primary: #030712; /* Perfect deep gray-950 background */
        --color-bg-secondary: #111827; /* Gray-900 for cards */
        --color-bg-dark: #000000;
        --color-text-primary: #f9fafb; /* Crisp gray-50 */
        --color-text-secondary: #9ca3af; /* Gray-400 for secondary */
        --color-text-muted: #6b7280; /* Gray-500 for muted */
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--color-bg-primary);
        color: var(--color-text-primary);
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s, color 0.3s;
      }
      h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; }
    </style>
     <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
      } else {
          document.documentElement.classList.remove('dark');
      }
    </script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              'primary-blue': 'var(--color-primary-blue)',
              'primary-green': 'var(--color-primary-green)',
              'secondary-orange': 'var(--color-secondary-orange)',
              'secondary-purple': 'var(--color-secondary-purple)',
              'success': 'var(--color-success)',
              'warning': 'var(--color-warning)',
              'error': 'var(--color-error)',
              'info': 'var(--color-info)',
              'bg-primary': 'var(--color-bg-primary)',
              'bg-secondary': 'var(--color-bg-secondary)',
              'bg-dark': 'var(--color-bg-dark)',
              'text-primary': 'var(--color-text-primary)',
              'text-secondary': 'var(--color-text-secondary)',
              'text-muted': 'var(--color-text-muted)',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-bg-primary">
    <div id="root"></div>
    <!-- Vite handles module resolution automatically from index.tsx -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
